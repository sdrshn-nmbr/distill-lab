[project]
name = "distill-lab"
version = "0.1.0"
description = "A reproducible lab for text and token-choice distillation with Codex and Miles."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "modal==1.4.2",
    "pydantic>=2.11,<3",
    "transformers>=5.12,<6",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
distill-lab = "distill_lab.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.403,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distill_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
